services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: shadowtube-proxy
    environment:
      NODE_ENV: production
      PORT: 8787
      # Optional: authenticated YouTube cookies for videos that return
      # LOGIN_REQUIRED / "Sign in to confirm you're not a bot" to anonymous EC2.
      YOUTUBE_COOKIE: ${YOUTUBE_COOKIE:-}
    ports:
      - "8788:8787"
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8787/ >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
