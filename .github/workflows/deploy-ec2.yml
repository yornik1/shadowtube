# Manual deploy: GitHub → Actions → SSH → Docker Compose on EC2.
# EC2 must have this repository cloned at deploy_path and Docker Compose available.
name: Deploy EC2 (SSH)

on:
  workflow_dispatch:
    inputs:
      deploy_path:
        description: "Repository path on EC2"
        required: true
        default: "/home/ubuntu/shadowtube"
        type: string
      git_ref:
        description: "Branch or tag to checkout and pull"
        required: true
        default: "main"
        type: string

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Checks, SSH and docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript proxy
        run: pnpm --filter @shadowtube/proxy typecheck

      - name: Test proxy
        run: pnpm --filter @shadowtube/proxy test

      - name: TypeScript mobile config
        run: pnpm --filter @shadowtube/mobile typecheck

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd "${{ inputs.deploy_path }}"
            git fetch --prune origin
            git checkout "${{ inputs.git_ref }}"
            git pull origin "${{ inputs.git_ref }}"
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps

            for attempt in 1 2 3 4 5; do
              if curl -fsS http://localhost:8788/ >/dev/null; then
                echo "Health check passed"
                exit 0
              fi

              echo "Health check failed, retry ${attempt}/5"
              sleep 5
            done

            echo "Health check failed after deploy. Last proxy logs:"
            docker compose -f docker-compose.prod.yml logs --tail 120 proxy
            exit 1
